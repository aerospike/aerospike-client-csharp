name: Release
run-name: Build release artifacts and generate API docs

permissions:
  id-token: write
  contents: read

on:
  push:
    branches: ["master"]
  workflow_dispatch:
    inputs:
      dry-run:
        type: boolean
        required: false
        default: false
        description: 'Dry run: only build and generate API docs (skip sign, deploy, and release)'

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@58077d3c7e43986b6b15fba718e8ea69e387dfcc # v2.15.1
      with:
        egress-policy: audit

    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - name: Setup .NET
      uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
      with:
        dotnet-version: 8.0.x
    - name: Build artifacts
      uses: ./.github/actions/build
      with:
        sgKey: ${{ secrets.SG_KEY }}
    - name: Get version from nupkg
      id: get-version
      shell: pwsh
      run: |
        $nupkg = Get-ChildItem -Path AerospikeClient\bin\Release -Filter "Aerospike.Client.*.nupkg" | Where-Object { $_.Extension -eq ".nupkg" } | Select-Object -First 1
        $version = $nupkg.BaseName -replace '^Aerospike\.Client\.', ''
        echo "version=$version" >> $env:GITHUB_OUTPUT

  sign:
    if: ${{ !inputs.dry-run }}
    needs: build
    uses: aerospike/shared-workflows/.github/workflows/reusable_sign-artifacts.yaml@07c958ca4c5cea494dc8790949c08e3fb28c55e1 # v3.3.0
    with:
      gh-unsigned-artifacts: AerospikeClient-${{ github.run_number }}
      gh-workflows-ref: v3.3.0
    secrets:
      gpg-private-key: ${{ secrets.GPG_SECRET_KEY }}
      gpg-public-key: ${{ secrets.GPG_PUBLIC_KEY }}
      gpg-key-pass: ${{ secrets.GPG_PASS }}
      es-username: ${{ secrets.ES_USERNAME }}
      es-password: ${{ secrets.ES_PASSWORD }}
      credential_id: ${{ secrets.CREDENTIAL_ID }}
      es-totp_secret: ${{ secrets.ES_TOTP_SECRET }}

  generate-api-docs:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@58077d3c7e43986b6b15fba718e8ea69e387dfcc # v2.15.1
      with:
        egress-policy: audit

    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - name: Setup .NET
      uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
      with:
        dotnet-version: 8.0.x
    - name: Install DocFX
      run: dotnet tool install -g docfx
    - name: Build project (for XML docs)
      run: dotnet build AerospikeClient/AerospikeClient.csproj --configuration Release
    - name: Set doc footer with version and commit
      run: |
        VERSION=$(echo "${{ needs.build.outputs.version }}" | sed 's/-[0-9]*$//')
        FOOTER="Aerospike C# Client v${VERSION} &#8226; ${{ github.sha }} &#8226; Copyright 2012-2026 Aerospike, Inc."
        jq --arg footer "$FOOTER" '.build.globalMetadata._appFooter = $footer' docfx.json > docfx.tmp && mv docfx.tmp docfx.json
    - name: Generate API documentation
      run: docfx docfx.json
    - name: Upload API docs artifact
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: api-docs-${{ needs.build.outputs.version }}
        path: _site
        retention-days: 90

  deploy:
    if: ${{ !inputs.dry-run }}
    needs: [build, sign]
    uses: aerospike/shared-workflows/.github/workflows/reusable_deploy-artifacts.yaml@07c958ca4c5cea494dc8790949c08e3fb28c55e1 # v3.3.0
    with:
      jf-project: database
      jf-build-name: aerospike-client-csharp
      jf-build-id: ${{ github.run_id }}-${{ github.run_attempt }}
      jf-metadata-build-id: ${{ github.run_id }}-${{ github.run_attempt }}-metadata
      version: ${{ needs.build.outputs.version }}
      gh-artifact-name: signed-artifacts
      gh-workflows-ref: v3.3.0
      oidc-provider-name: database-gh-aerospike
      oidc-audience: database-gh-aerospike

  create-release-bundle:
    if: ${{ !inputs.dry-run }}
    needs: [build, deploy]
    uses: aerospike/shared-workflows/.github/workflows/reusable_create-release-bundle.yaml@07c958ca4c5cea494dc8790949c08e3fb28c55e1 # v3.3.0
    with:
      jf-project: database
      jf-build-names: "aerospike-client-csharp:${{ github.run_id }}-${{ github.run_attempt }}"
      jf-bundle-name: aerospike-client-csharp
      version: ${{ needs.build.outputs.version }}
      gh-workflows-ref: v3.3.0
      oidc-provider-name: database-gh-aerospike
      oidc-audience: database-gh-aerospike

  promote-release-bundle:
    if: ${{ !inputs.dry-run }}
    needs: [build, create-release-bundle]
    runs-on: ubuntu-latest
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@58077d3c7e43986b6b15fba718e8ea69e387dfcc # v2.15.1
      with:
        egress-policy: audit

    - name: Setup JFrog CLI
      uses: step-security/setup-jfrog-cli@893a92f96c7727242adf0e603c77b1f2a22390e1 # v4.9.1
      env:
        JF_URL: https://aerospike.jfrog.io
        JF_PROJECT: database
      with:
        oidc-provider-name: database-gh-aerospike
        oidc-audience: database-gh-aerospike

    - name: Promote release bundle to DEV
      uses: aerospike/shared-workflows/.github/actions/promote-release-bundle@07c958ca4c5cea494dc8790949c08e3fb28c55e1 # v3.3.0
      with:
        bundle-name: aerospike-client-csharp
        version: ${{ needs.build.outputs.version }}
        environment: DEV
        jf-project: database
