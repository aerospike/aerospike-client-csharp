name: Build and test dev
run-name: Build artifacts and run dev branch tests (server-tag=${{ inputs.server-tag || 'latest' }})

permissions:
  # This is required for requesting the OIDC token
  id-token: write
  contents: read
  checks: write
  pull-requests: write

# Trigger test workflow whenever:
# 1. Commits are pushed directly to a CLIENT branch
# 2. Pull requests to stage branch are updated
on:
  push:
    branches: ["CLIENT*"]
  pull_request:
    branches: ["stage"]
    types: [
      # Default triggers
      opened,
      synchronize,
      reopened
    ]
  workflow_dispatch:
    inputs:
      server-tag:
        type: string
        required: false
        default: "latest"
        description: "Server docker image tag"
      server-type:
        type: string
        required: false
        default: "aerospike-server-enterprise"
      enable-tls:
        type: boolean
        required: false
        default: false
        description: "Enable TLS for server and test connections"
      strong-consistency:
        type: choice
        required: false
        default: "1"
        description: "Enable strong consistency (1=on, 0=off)"
        options:
          - "0"
          - "1"

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@58077d3c7e43986b6b15fba718e8ea69e387dfcc # v2.15.1
      with:
        egress-policy: audit

    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - name: Setup .NET
      uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
      with:
        dotnet-version: 8.0.x
    - name: Build artifacts
      uses: ./.github/actions/build
      with:
        sgKey: ${{ secrets.SG_KEY }}
    - name: Get version from nupkg
      id: get-version
      shell: pwsh
      run: |
        $nupkg = Get-ChildItem -Path AerospikeClient\bin\Release -Filter "Aerospike.Client.*.nupkg" | Where-Object { $_.Extension -eq ".nupkg" } | Select-Object -First 1
        $version = $nupkg.BaseName -replace '^Aerospike\.Client\.', ''
        echo "version=$version" >> $env:GITHUB_OUTPUT

  sign:
    needs: build
    uses: aerospike/shared-workflows/.github/workflows/reusable_sign-artifacts.yaml@f6bb565e7d31fa3013a1a75c5f80aed44c3bde5c # v3.4.1
    with:
      gh-unsigned-artifacts: AerospikeClient-${{ github.run_id }}
      gh-workflows-ref: v3.4.1
    secrets:
      gpg-private-key: ${{ secrets.GPG_SECRET_KEY }}
      gpg-public-key: ${{ secrets.GPG_PUBLIC_KEY }}
      gpg-key-pass: ${{ secrets.GPG_PASS }}
      es-username: ${{ secrets.ES_USERNAME }}
      es-password: ${{ secrets.ES_PASSWORD }}
      credential_id: ${{ secrets.CREDENTIAL_ID }}
      es-totp_secret: ${{ secrets.ES_TOTP_SECRET }}

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@58077d3c7e43986b6b15fba718e8ea69e387dfcc # v2.15.1
      with:
        egress-policy: audit

    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - name: Test
      uses: ./.github/actions/test
      with:
        server-tag: ${{ inputs.server-tag || 'latest' }}
        server-type: ${{ inputs.server-type || 'aerospike-server-enterprise' }}
        enable-tls: ${{ inputs.enable-tls && 'true' || 'false' }}
        strong-consistency: ${{ inputs.strong-consistency || '1' }}
        features-content: ${{ secrets.AES_FEATURES_CONF }}
        oidc-provider: database-gh-aerospike
        oidc-audience: database-gh-aerospike

    - name: Publish test results
      if: ${{ !cancelled() }}
      uses: EnricoMi/publish-unit-test-result-action@3a74b2957438d0b6e2e61d67b05318aa25c9e6c6 # v2.20.0
      with:
        files: test-results/**/*.trx
        check_name: "Test Results (${{ inputs.server-tag || 'latest' }})"

  deploy:
    needs: [build, sign, test]
    uses: aerospike/shared-workflows/.github/workflows/reusable_deploy-artifacts.yaml@f6bb565e7d31fa3013a1a75c5f80aed44c3bde5c # v3.4.1
    with:
      jf-project: database
      jf-build-name: aerospike-client-csharp
      jf-build-id: ${{ github.run_id }}-${{ github.run_attempt }}
      jf-metadata-build-id: ${{ github.run_id }}-${{ github.run_attempt }}-metadata
      version: ${{ needs.build.outputs.version }}
      gh-artifact-name: signed-artifacts
      gh-workflows-ref: v3.4.1
      oidc-provider-name: database-gh-aerospike
      oidc-audience: database-gh-aerospike

  deploy-test:
    needs: [build, test]
    uses: aerospike/shared-workflows/.github/workflows/reusable_deploy-artifacts.yaml@f6bb565e7d31fa3013a1a75c5f80aed44c3bde5c # v3.4.1
    with:
      jf-project: database
      jf-build-name: aerospike-client-csharp-tests
      jf-build-id: ${{ github.run_id }}-${{ github.run_attempt }}-tests
      jf-metadata-build-id: ${{ github.run_id }}-${{ github.run_attempt }}-tests-metadata
      version: ${{ needs.build.outputs.version }}
      gh-artifact-name: AerospikeTest-${{ github.run_id }}
      gh-workflows-ref: v3.4.1
      oidc-provider-name: database-gh-aerospike
      oidc-audience: database-gh-aerospike

  create-release-bundle:
    needs: [build, deploy]
    uses: aerospike/shared-workflows/.github/workflows/reusable_create-release-bundle.yaml@f6bb565e7d31fa3013a1a75c5f80aed44c3bde5c # v3.4.1
    with:
      jf-project: database
      jf-build-names: "aerospike-client-csharp:${{ github.run_id }}-${{ github.run_attempt }}"
      jf-bundle-name: aerospike-client-csharp
      version: ${{ needs.build.outputs.version }}
      gh-workflows-ref: v3.4.1
      oidc-provider-name: database-gh-aerospike
      oidc-audience: database-gh-aerospike

  promote-release-bundle:
    needs: [build, create-release-bundle]
    runs-on: ubuntu-latest
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@58077d3c7e43986b6b15fba718e8ea69e387dfcc # v2.15.1
      with:
        egress-policy: audit

    - name: Setup JFrog CLI
      uses: step-security/setup-jfrog-cli@893a92f96c7727242adf0e603c77b1f2a22390e1 # v4.9.1
      env:
        JF_URL: https://aerospike.jfrog.io
        JF_PROJECT: database
      with:
        oidc-provider-name: database-gh-aerospike
        oidc-audience: database-gh-aerospike

    - name: Promote release bundle to DEV
      uses: aerospike/shared-workflows/.github/actions/promote-release-bundle@f6bb565e7d31fa3013a1a75c5f80aed44c3bde5c # v3.4.1
      with:
        bundle-name: aerospike-client-csharp
        version: ${{ needs.build.outputs.version }}
        environment: DEV
        jf-project: database
