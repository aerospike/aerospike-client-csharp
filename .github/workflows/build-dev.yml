name: Build and test
run-name: "${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || (github.event_name == 'workflow_dispatch' && inputs.release-candidate && 'Release candidate') || (github.event_name == 'push' && 'Stage') || 'Dev' }} build (${{ inputs.server-tag || 'latest' }}, ${{ (inputs.server-type || 'aerospike-server-enterprise') == 'aerospike-server-enterprise' && 'enterprise' || 'community' }}, ${{ (inputs.server-type || 'aerospike-server-enterprise') == 'aerospike-server-enterprise' && (format('{0}', inputs.strong-consistency) == 'false' && 'AP' || 'SC') || 'AP' }}${{ (inputs.server-type || 'aerospike-server-enterprise') == 'aerospike-server-enterprise' && inputs.enable-tls && ', TLS' || '' }})"

permissions:
  # Required for OIDC token requests (used by JFrog/sign jobs)
  id-token: write
  contents: read
  # Required so the PR-validation path can publish test results back to the PR
  checks: write
  pull-requests: write

# Single workflow that covers PR validation against `stage`, post-merge
# prerelease publishes to JFrog, and explicit release-candidate cuts.
#
# Trigger matrix:
#   pull_request      → PR validation (build/test only; no signing/deploy)
#   push to stage     → prerelease: pack base-ci.N, sign/test, deploy to JFrog,
#                       create release bundle, promote DEV then TEST
#   workflow_dispatch → ad-hoc build; with release-candidate=true (from stage
#                       only) packs the bare .csproj version and deploys
#
# Cycle base in .csproj must stay clean X.Y.Z for automatic stage deploys.
# CI appends -ci.{run_number} (and .{run_attempt} on re-runs). Do not hand-bump
# for uniqueness — use Bump version (PR into stage) only to change the base
# or to set a ship/preview cut version before an RC dispatch.
#
# release-candidate=true must be dispatched from the stage branch. Stage push
# and RC deploys share a concurrency group so JFrog create/promote cannot race.
on:
  pull_request:
    branches: [stage]
    types: [opened, synchronize, reopened]
  push:
    branches: [stage]
  workflow_dispatch:
    inputs:
      release-candidate:
        type: boolean
        required: false
        default: false
        description: Pack .csproj Version as-is (GA or -alpha) and deploy to JFrog. Must run from stage. Do not use for ordinary builds.
      server-tag:
        type: string
        required: false
        default: latest
        description: Server docker image tag
      server-type:
        type: string
        required: false
        default: aerospike-server-enterprise
      strong-consistency:
        type: boolean
        required: false
        default: true
        description: Enable strong consistency. Enterprise edition required.
      enable-tls:
        type: boolean
        required: false
        default: false
        description: Enable TLS for server and test connections. Enterprise edition required.

# Queue stage push + RC deploys so JFrog bundle create/promote cannot overlap.
# PR and ad-hoc (non-RC) runs use a unique group and do not block each other.
concurrency:
  group: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/stage') || (github.event_name == 'workflow_dispatch' && inputs.release-candidate)) && format('jfrog-csharp-{0}', github.ref) || format('{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.resolve-version.outputs.version }}
      should-deploy: ${{ steps.resolve-version.outputs.should-deploy }}
      is-ci-prerelease: ${{ steps.resolve-version.outputs.is-ci-prerelease }}
      package-version: ${{ steps.resolve-version.outputs.package-version }}
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: audit

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Resolve package version
      id: resolve-version
      shell: pwsh
      env:
        RELEASE_CANDIDATE: ${{ format('{0}', inputs.release-candidate) }}
        EVENT_NAME: ${{ github.event_name }}
        REF: ${{ github.ref }}
        RUN_NUMBER: ${{ github.run_number }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
      run: |
        $ErrorActionPreference = 'Stop'
        [xml]$xml = Get-Content -Path AerospikeClient\AerospikeClient.csproj
        $base = ($xml.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1)
        if (-not $base) {
          Write-Error "Could not read <Version> from AerospikeClient/AerospikeClient.csproj"
          exit 1
        }
        $base = $base.Trim()
        Write-Host "Committed base version: $base"

        $isRC = $env:RELEASE_CANDIDATE -eq 'true'
        $isStagePush = ($env:EVENT_NAME -eq 'push') -and ($env:REF -eq 'refs/heads/stage')
        $hasPrerelease = $base -match '-'
        $isCiLabel = $base -match '(^|[.-])ci\.'

        $packageVersion = ''
        $shouldDeploy = 'false'
        $isCiPrerelease = 'false'
        $version = $base

        if ($isRC) {
          if ($env:REF -ne 'refs/heads/stage') {
            Write-Error "release-candidate=true must be dispatched from the stage branch (got '$($env:REF)'). In the Actions UI, set 'Use workflow from' to stage."
            exit 1
          }
          if ($isCiLabel) {
            Write-Error "release-candidate=true refuses CI prerelease base '$base'. Set a clean X.Y.Z or preview X.Y.Z-alpha via Bump version first."
            exit 1
          }
          if (-not ($base -match '^\d+\.\d+\.\d+$' -or $base -match '^\d+\.\d+\.\d+-alpha$')) {
            Write-Error "release-candidate=true expects clean X.Y.Z or X.Y.Z-alpha (got '$base')."
            exit 1
          }
          $packageVersion = $base
          $version = $base
          $shouldDeploy = 'true'
          Write-Host "Release candidate: packing bare version $version from stage"
        }
        elseif ($isStagePush) {
          if ($hasPrerelease) {
            Write-Host "::warning::Stage push with non-clean base '$base'. Skipping JFrog deploy (will not invent -alpha.ci.N). Run release-candidate=true for a preview/GA cut, or bump back to a clean X.Y.Z cycle base."
            $packageVersion = ''
            $version = $base
            $shouldDeploy = 'false'
            @"
## Version resolution

- **Base:** ``$base``
- **Deploy:** skipped (non-clean base on automatic stage push)
- **Next step:** run **Build and test** with ``release-candidate=true``, or open a Bump version PR back to a clean ``X.Y.Z``
"@ | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
          }
          else {
            $suffix = $env:RUN_NUMBER
            if ([int]$env:RUN_ATTEMPT -gt 1) {
              $suffix = "$suffix.$($env:RUN_ATTEMPT)"
            }
            $packageVersion = "$base-ci.$suffix"
            $version = $packageVersion
            $shouldDeploy = 'true'
            $isCiPrerelease = 'true'
            Write-Host "In-cycle prerelease: $version"
          }
        }
        else {
          Write-Host "PR/ad-hoc build: using committed base $base (no JFrog deploy)"
          $packageVersion = ''
          $version = $base
          $shouldDeploy = 'false'
        }

        "base=$base" >> $env:GITHUB_OUTPUT
        "package-version=$packageVersion" >> $env:GITHUB_OUTPUT
        "version=$version" >> $env:GITHUB_OUTPUT
        "should-deploy=$shouldDeploy" >> $env:GITHUB_OUTPUT
        "is-ci-prerelease=$isCiPrerelease" >> $env:GITHUB_OUTPUT

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: 8.0.x

    - name: Build artifacts
      uses: ./.github/actions/build
      with:
        sgKey: ${{ secrets.SG_KEY }}
        sign-client: ${{ steps.resolve-version.outputs.should-deploy == 'true' }}
        package-version: ${{ steps.resolve-version.outputs.package-version }}

    - name: Verify nupkg version
      if: ${{ steps.resolve-version.outputs.package-version != '' }}
      shell: pwsh
      env:
        EXPECTED: ${{ steps.resolve-version.outputs.version }}
      run: |
        $nupkg = Get-ChildItem -Path AerospikeClient\bin\Release -Filter "Aerospike.Client.*.nupkg" |
          Where-Object { $_.Extension -eq ".nupkg" } |
          Select-Object -First 1
        if (-not $nupkg) {
          Write-Error "No Aerospike.Client.*.nupkg found"
          exit 1
        }
        $actual = $nupkg.BaseName -replace '^Aerospike\.Client\.', ''
        if ($actual -ne $env:EXPECTED) {
          Write-Error "nupkg version '$actual' does not match expected '$($env:EXPECTED)'"
          exit 1
        }
        Write-Host "Verified nupkg version: $actual"

  sign:
    if: ${{ needs.build.outputs.should-deploy == 'true' }}
    needs: build
    uses: aerospike/shared-workflows/.github/workflows/reusable_sign-artifacts.yaml@0d843cff870d70ac527048ab0d006c7c301fbb2f # v4.1.0
    with:
      gh-unsigned-artifacts: AerospikeClient-${{ github.run_id }}
      gh-workflows-ref: v4.1.0
    secrets:
      gpg-private-key: ${{ secrets.GPG_SECRET_KEY }}
      gpg-public-key: ${{ secrets.GPG_PUBLIC_KEY }}
      gpg-key-pass: ${{ secrets.GPG_PASS }}
      es-username: ${{ secrets.ES_USERNAME }}
      es-password: ${{ secrets.ES_PASSWORD }}
      credential_id: ${{ secrets.CREDENTIAL_ID }}
      es-totp_secret: ${{ secrets.ES_TOTP_SECRET }}

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: audit

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # Resolve test inputs once so trusted PR/push runs (which have no `inputs.*`)
    # behave the same as a workflow_dispatch run that accepts all defaults.
    # Notes on the tricky cases:
    #   • `format('{0}', inputs.X)` coerces null → '' for safe string compare,
    #     avoiding GitHub's loose equality where `null == false` is true.
    #   • Untrusted PRs (Dependabot/forks) use the community server so they do
    #     not need enterprise features.conf secrets.
    #   • Community server runs are always AP and non-TLS.
    - name: Resolve test inputs
      id: cfg
      shell: bash
      env:
        IN_SERVER_TAG: ${{ inputs.server-tag }}
        IN_SERVER_TYPE: ${{ inputs.server-type }}
        IN_ENABLE_TLS: ${{ format('{0}', inputs.enable-tls) }}
        IN_STRONG_CONSISTENCY: ${{ format('{0}', inputs.strong-consistency) }}
        IN_TRUSTED_SECRETS: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
      run: |
        SERVER_TAG="${IN_SERVER_TAG:-latest}"
        if [ "$IN_TRUSTED_SECRETS" = "true" ]; then
          SERVER_TYPE="${IN_SERVER_TYPE:-aerospike-server-enterprise}"
        else
          SERVER_TYPE="${IN_SERVER_TYPE:-aerospike-server}"
        fi
        ENABLE_TLS="${IN_ENABLE_TLS:-false}"
        # Default SC to '1' (enabled). Only flip to '0' when the dispatch input
        # is explicitly false; null/empty (PR/push) keeps the default.
        if [ "$IN_STRONG_CONSISTENCY" = "false" ]; then
          SC="0"
        else
          SC="1"
        fi
        if [ "$ENABLE_TLS" = "true" ]; then ENABLE_TLS="true"; else ENABLE_TLS="false"; fi
        if [ "$SERVER_TYPE" != "aerospike-server-enterprise" ]; then
          ENABLE_TLS="false"
          SC="0"
        fi
        {
          echo "server-tag=$SERVER_TAG"
          echo "server-type=$SERVER_TYPE"
          echo "enable-tls=$ENABLE_TLS"
          echo "strong-consistency=$SC"
          echo "is-enterprise=$([ "$SERVER_TYPE" = "aerospike-server-enterprise" ] && echo true || echo false)"
        } >> "$GITHUB_OUTPUT"

    - name: Test
      uses: ./.github/actions/test
      with:
        server-tag: ${{ steps.cfg.outputs.server-tag }}
        server-type: ${{ steps.cfg.outputs.server-type }}
        enable-tls: ${{ steps.cfg.outputs.enable-tls }}
        strong-consistency: ${{ steps.cfg.outputs.strong-consistency }}
        features-content: ${{ steps.cfg.outputs.is-enterprise == 'true' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) && secrets.AES_FEATURES_CONF || '' }}
        oidc-provider: gh-aerospike
        oidc-audience: aerospike

    # Trusted PR-only: surface test results as a check + comment on the pull request.
    # Dependabot/fork PR tokens cannot write checks/comments.
    - name: Publish test results
      if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
      uses: step-security/publish-unit-test-result-action@681100d67b09305624c089873f12c545ee7cbc24 # v2.23.0
      with:
        files: test-results/**/*.trx
        check_name: "Test Results (${{ steps.cfg.outputs.server-tag }})"

    # Trusted PR-only: publish example smoke tests as their own result check.
    - name: Publish example run results
      if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' && hashFiles('example-results/**/*.trx') != '' }}
      uses: step-security/publish-unit-test-result-action@681100d67b09305624c089873f12c545ee7cbc24 # v2.23.0
      with:
        files: example-results/**/*.trx
        check_name: "Example Run (${{ steps.cfg.outputs.server-tag }})"

  deploy:
    if: ${{ needs.build.outputs.should-deploy == 'true' }}
    needs: [build, sign, test]
    uses: aerospike/shared-workflows/.github/workflows/reusable_deploy-artifacts.yaml@0d843cff870d70ac527048ab0d006c7c301fbb2f # v4.1.0
    with:
      jf-project: database
      jf-build-name: aerospike-client-csharp
      jf-build-id: ${{ github.run_id }}-${{ github.run_attempt }}
      jf-metadata-build-id: ${{ github.run_id }}-${{ github.run_attempt }}-metadata
      version: ${{ needs.build.outputs.version }}
      gh-artifact-name: signed-artifacts
      gh-workflows-ref: v4.1.0
      oidc-provider-name: gh-aerospike
      oidc-audience: aerospike

  prepare-test-artifacts:
    if: ${{ needs.build.outputs.should-deploy == 'true' }}
    needs: [build, test]
    runs-on: ubuntu-latest
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: audit

    - name: Setup JFrog CLI
      uses: step-security/setup-jfrog-cli@53aeacb709fce45d0baf69a13ec3342f7e2d71a9 # v5.1.0
      env:
        JF_URL: https://artifact.aerospike.io
        JF_PROJECT: database
      with:
        oidc-provider-name: gh-aerospike
        oidc-audience: aerospike

    - name: Remove existing test artifacts
      env:
        JF_PROJECT: database
        TEST_BUILD_NAME: aerospike-client-csharp-tests
        VERSION: ${{ needs.build.outputs.version }}
      run: |
        set -euo pipefail

        test_artifacts_path="${JF_PROJECT}-generic-dev-local/${TEST_BUILD_NAME}/${VERSION}/"
        echo "Removing existing test artifacts from ${test_artifacts_path}..."
        jf rt delete "${test_artifacts_path}*" --quiet

  deploy-test:
    if: ${{ needs.build.outputs.should-deploy == 'true' }}
    needs: [build, test, prepare-test-artifacts]
    uses: aerospike/shared-workflows/.github/workflows/reusable_deploy-artifacts.yaml@0d843cff870d70ac527048ab0d006c7c301fbb2f # v4.1.0
    with:
      jf-project: database
      jf-build-name: aerospike-client-csharp-tests
      jf-build-id: ${{ github.run_id }}-${{ github.run_attempt }}-tests
      jf-metadata-build-id: ${{ github.run_id }}-${{ github.run_attempt }}-tests-metadata
      version: ${{ needs.build.outputs.version }}
      gh-artifact-name: AerospikeTest-${{ github.run_id }}
      gh-workflows-ref: v4.1.0
      oidc-provider-name: gh-aerospike
      oidc-audience: aerospike

  prepare-release-bundle:
    if: ${{ needs.build.outputs.should-deploy == 'true' }}
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: audit

    - name: Setup JFrog CLI
      uses: step-security/setup-jfrog-cli@53aeacb709fce45d0baf69a13ec3342f7e2d71a9 # v5.1.0
      env:
        JF_URL: https://artifact.aerospike.io
        JF_PROJECT: database
      with:
        oidc-provider-name: gh-aerospike
        oidc-audience: aerospike

    - name: Guard release bundle uniqueness
      env:
        BUNDLE_NAME: aerospike-client-csharp
        BUNDLE_VERSION: ${{ needs.build.outputs.version }}
        IS_CI_PRERELEASE: ${{ needs.build.outputs.is-ci-prerelease }}
        JF_PROJECT: database
      run: |
        set -euo pipefail

        # CI prereleases are unique per run (-ci.N). Skip the pre-create check.
        # Clean/preview coordinates are immutable until INFRA-692 supersede:
        # refuse to create if any completed promotion already exists for this version.
        if [ "$IS_CI_PRERELEASE" = "true" ]; then
          echo "CI prerelease ${BUNDLE_VERSION}: unique coordinate; skipping prior-bundle check."
          exit 0
        fi

        records_path="/lifecycle/api/v2/promotion/records/${BUNDLE_NAME}?project=${JF_PROJECT}&filter_by=${BUNDLE_VERSION}&order_by=created_millis&order_asc=true"
        echo "Checking promotion records for ${BUNDLE_NAME}/${BUNDLE_VERSION}..."
        records_json='{"promotions":[]}'
        set +e
        fetched_records=$(jf rt curl -X GET "$records_path" -H "Accept: application/json" 2>jfrog-error.log)
        status=$?
        set -e

        if [ "$status" -ne 0 ]; then
          error_text="$(<jfrog-error.log)"
          if [[ "$error_text" == *"404"* || "$error_text" == *"not found"* || "$fetched_records" == *"404"* ]]; then
            echo "No existing release bundle promotion records found."
          else
            echo "::error::Failed to fetch promotion records for ${BUNDLE_NAME}/${BUNDLE_VERSION}."
            echo "$error_text"
            exit "$status"
          fi
        else
          records_json="$fetched_records"
        fi

        echo "$records_json" | jq '.'

        if echo "$records_json" | jq -e '.errors? | length > 0' >/dev/null; then
          if echo "$records_json" | jq -e '.errors[]? | (.status | tostring) == "404"' >/dev/null; then
            echo "::warning::Promotion records endpoint returned 404; treating this as no existing promotion records."
            records_json='{"promotions":[]}'
          else
            echo "::error::Failed to fetch promotion records for ${BUNDLE_NAME}/${BUNDLE_VERSION}."
            exit 1
          fi
        fi

        existing_envs=$(echo "$records_json" | jq -r --arg version "$BUNDLE_VERSION" '
          [(.promotions // [])[]?
            | select((.release_bundle_version // .releaseBundleVersion // .version // "") == $version)
            | select((.status // "COMPLETED") == "COMPLETED")
            | (.environment // .target_environment // .targetEnvironment // empty)]
          | unique
          | join(", ")
        ')

        if [ -n "$existing_envs" ]; then
          echo "::error::Release bundle ${BUNDLE_NAME}/${BUNDLE_VERSION} already has completed promotions: ${existing_envs}."
          echo "::error::Refusing to create a duplicate clean/preview coordinate. Escalate to devops until INFRA-692 supersede is available."
          exit 1
        fi

        echo "No existing release bundle promotions for ${BUNDLE_VERSION}; safe to create."

  create-release-bundle:
    if: ${{ needs.build.outputs.should-deploy == 'true' }}
    needs: [build, deploy, prepare-release-bundle]
    uses: aerospike/shared-workflows/.github/workflows/reusable_create-release-bundle.yaml@0d843cff870d70ac527048ab0d006c7c301fbb2f # v4.1.0
    with:
      jf-project: database
      jf-build-names: "aerospike-client-csharp:${{ github.run_id }}-${{ github.run_attempt }}"
      jf-bundle-name: aerospike-client-csharp
      version: ${{ needs.build.outputs.version }}
      gh-workflows-ref: v4.1.0
      oidc-provider-name: gh-aerospike
      oidc-audience: aerospike

  promote-release-bundle:
    if: ${{ needs.build.outputs.should-deploy == 'true' }}
    needs: [build, create-release-bundle]
    runs-on: ubuntu-latest
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: audit

    - name: Setup JFrog CLI
      uses: step-security/setup-jfrog-cli@53aeacb709fce45d0baf69a13ec3342f7e2d71a9 # v5.1.0
      env:
        JF_URL: https://artifact.aerospike.io
        JF_PROJECT: database
      with:
        oidc-provider-name: gh-aerospike
        oidc-audience: aerospike

    - name: Promote release bundle to DEV
      uses: aerospike/shared-workflows/.github/actions/promote-release-bundle@0d843cff870d70ac527048ab0d006c7c301fbb2f # v4.1.0
      with:
        bundle-name: aerospike-client-csharp
        version: ${{ needs.build.outputs.version }}
        environment: DEV
        jf-project: database

    - name: Promote release bundle to TEST
      uses: aerospike/shared-workflows/.github/actions/promote-release-bundle@0d843cff870d70ac527048ab0d006c7c301fbb2f # v4.1.0
      with:
        bundle-name: aerospike-client-csharp
        version: ${{ needs.build.outputs.version }}
        environment: TEST
        jf-project: database

    - name: Summary
      run: |
        echo "## Release Bundle Promoted" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Bundle:** aerospike-client-csharp" >> $GITHUB_STEP_SUMMARY
        echo "- **Version:** ${{ needs.build.outputs.version }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Environments:** DEV → TEST" >> $GITHUB_STEP_SUMMARY
        if [ "${{ needs.build.outputs.is-ci-prerelease }}" = "true" ]; then
          echo "- **Note:** CI prerelease — do not promote above TEST" >> $GITHUB_STEP_SUMMARY
        fi
