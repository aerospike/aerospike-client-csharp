name: Bump version
run-name: "Bump version to ${{ inputs.version }}${{ inputs.dry-run && ' (dry run)' || '' }}"

# Sets the committed *base* (or ship/preview cut) version in .csproj via a PR
# into stage. Use this for:
#   - next-cycle base after GA/preview (e.g. 8.5.1)
#   - clean GA cut (e.g. 8.5.0) before release-candidate dispatch
#   - one-shot preview cut (e.g. 8.0.0-alpha, 9.0.0-beta.1) before release-candidate dispatch
#
# It does NOT create release tags — that happens in release.yml after
# stage→master. It does NOT create per-build uniqueness; stage pushes append
# -ci.{run_number} automatically for clean bases.
#
# Who can run this: anyone with write access who can dispatch Actions (same as
# other workflow_dispatch jobs). The opened PR still needs normal review before
# merge to stage — that is the real gate. Prefer restricting via branch
# protection / CODEOWNERS on *.csproj over a dedicated GitHub Environment.

permissions:
  contents: write
  pull-requests: write

on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        required: true
        description: Version to set (e.g. 8.5.1, 8.0.0-alpha, 9.0.0-beta.1)
      dry-run:
        type: boolean
        required: false
        default: false
        description: Show what would change without opening a PR
  workflow_call:
    inputs:
      version:
        type: string
        required: true
        description: Version to set (e.g. 8.5.1, 8.0.0-alpha, 9.0.0-beta.1)
      ref:
        type: string
        required: false
        default: stage
        description: Branch to open the PR against (default stage)
      dry-run:
        type: boolean
        required: false
        default: false
    outputs:
      pr-url:
        description: URL of the opened version-bump pull request
        value: ${{ jobs.bump.outputs.pr-url }}
      branch:
        description: Branch name created for the bump PR
        value: ${{ jobs.bump.outputs.branch }}

jobs:
  bump:
    runs-on: ubuntu-latest
    outputs:
      pr-url: ${{ steps.open-pr.outputs.pr-url }}
      branch: ${{ steps.open-pr.outputs.branch }}
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: audit

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.ref || 'stage' }}

    - name: Update version in .csproj files
      shell: pwsh
      env:
        TARGET_VERSION: ${{ inputs.version }}
        IS_DRY_RUN: ${{ inputs.dry-run }}
      run: |
        $ErrorActionPreference = 'Stop'
        $targetVersion = $env:TARGET_VERSION.Trim()
        $isDryRun = $env:IS_DRY_RUN -eq 'true'

        # Same allowlist as scripts/update-version.ps1 (NuGet/SemVer 2).
        if (-not ($targetVersion -match '^\d+\.\d+\.\d+(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?(?:\+[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?$')) {
          Write-Error "Version must be a NuGet/SemVer version (e.g. 8.5.1, 8.0.0-alpha, 9.0.0-beta.1); got '$targetVersion'."
          exit 1
        }

        $projectFiles = Get-ChildItem -Path . -Recurse -Filter *.csproj -File |
          Where-Object { $_.FullName -notmatch '[\\/](bin|obj)[\\/]' } |
          Sort-Object FullName

        if (-not $projectFiles) {
          Write-Host "No .csproj files found."
          exit 0
        }

        foreach ($projectFile in $projectFiles) {
          [xml]$xml = Get-Content -Path $projectFile.FullName
          $projectNode = $xml.Project
          $versionNodes = @(
            @($projectNode.SelectNodes('//Project/PropertyGroup/Version'))
            @($projectNode.SelectNodes('//Project/PropertyGroup/VersionPrefix'))
            @($projectNode.SelectNodes('//Project/PropertyGroup/PackageVersion'))
          ) | Where-Object { $_ }

          $changed = $false

          foreach ($node in $versionNodes) {
            if ($node.InnerText -ne $targetVersion) {
              Write-Host "$($projectFile.FullName): $($node.Name) '$($node.InnerText)' -> '$targetVersion'"
              if (-not $isDryRun) {
                $node.InnerText = $targetVersion
              }
              $changed = $true
            }
          }

          if (-not $versionNodes) {
            $propertyGroup = $projectNode.PropertyGroup | Select-Object -First 1
            if (-not $propertyGroup) {
              $propertyGroup = $xml.CreateElement('PropertyGroup', $projectNode.NamespaceURI)
              [void]$projectNode.AppendChild($propertyGroup)
            }

            Write-Host "$($projectFile.FullName): add Version '$targetVersion'"
            if (-not $isDryRun) {
              $versionElement = $xml.CreateElement('Version', $projectNode.NamespaceURI)
              $versionElement.InnerText = $targetVersion
              [void]$propertyGroup.AppendChild($versionElement)
            }
            $changed = $true
          }

          if ($changed -and -not $isDryRun) {
            $xml.Save($projectFile.FullName)
          }
        }

    - name: Open pull request
      if: ${{ !inputs.dry-run }}
      id: open-pr
      env:
        TARGET_VERSION: ${{ inputs.version }}
        BASE_REF: ${{ inputs.ref || 'stage' }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        if git diff --quiet && git diff --cached --quiet; then
          echo "No changes — version already at ${TARGET_VERSION}"
          echo "pr-url=" >> "$GITHUB_OUTPUT"
          echo "branch=" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        branch="chore/bump-version-${TARGET_VERSION}"
        # Avoid collisions if the branch already exists from a prior run.
        if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
          branch="${branch}-${GITHUB_RUN_ID}"
        fi

        git checkout -b "$branch"
        git add -A
        git commit -m "Update version ${TARGET_VERSION}"
        git push -u origin HEAD

        pr_body=$(printf '%s\n' \
          "## Summary" \
          "Sets committed \`<Version>\` to **${TARGET_VERSION}** (cycle base, GA cut, or SemVer preview such as \`-alpha\` / \`-beta.1\`)." \
          "" \
          "Per-build uniqueness (\`-ci.N\`) is applied automatically by CI on stage pushes for clean bases. After merging a GA or preview cut, run **Build and test** with \`release-candidate=true\` from the **stage** branch to publish the bare version. After shipping, open another bump PR back to the next clean \`X.Y.Z\`." \
          "" \
          "## Test plan" \
          "- [ ] PR CI green" \
          "- [ ] Confirm \`<Version>\` in all \`.csproj\` files is \`${TARGET_VERSION}\`")

        pr_url=$(gh pr create \
          --base "$BASE_REF" \
          --head "$branch" \
          --title "Bump version to ${TARGET_VERSION}" \
          --body "$pr_body")

        echo "pr-url=${pr_url}" >> "$GITHUB_OUTPUT"
        echo "branch=${branch}" >> "$GITHUB_OUTPUT"
        echo "Opened PR: ${pr_url}"

    - name: Summary
      shell: pwsh
      env:
        TARGET_VERSION: ${{ inputs.version }}
        IS_DRY_RUN: ${{ inputs.dry-run }}
        PR_URL: ${{ steps.open-pr.outputs.pr-url }}
        BRANCH: ${{ steps.open-pr.outputs.branch }}
      run: |
        $summary = "## Version Bump`n"
        $summary += "- **Version:** $env:TARGET_VERSION`n"
        $summary += "- **Dry run:** $env:IS_DRY_RUN"
        if ($env:IS_DRY_RUN -ne 'true') {
          if ($env:PR_URL) {
            $summary += "`n- **Pull request:** $($env:PR_URL)"
            $summary += "`n- **Branch:** ``$($env:BRANCH)``"
          }
          else {
            $summary += "`n- **Result:** no changes (already at target version)"
          }
        }
        $summary += "`n`nApprove and merge the PR into ``stage``. Release tags are created by ``release.yml`` after stage→master for a clean GA version."
        $summary | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
