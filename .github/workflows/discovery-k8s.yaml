name: Discovery L3 K8s run

# Kind plus AKO takes several minutes, so L3 runs as its own workflow. The job
# needs the Enterprise feature key (AES_FEATURES_CONF). Fork pull requests do not
# receive repository secrets, so on a fork pull request the job fails at the key
# check.
#
# setup-kind-ako writes the endpoint hostname into the runner hosts file, aimed
# at the kind node. Tests run on the runner with dotnet, like the Java client.
#
# The l3-tls job builds the same cluster at two pods and runs enable-l3-tls.sh,
# which serves TLS from a secret with a certificate for the cluster tls-name,
# before TestK8sTlsName.

permissions:
  contents: read
  checks: write
  pull-requests: write

on:
  pull_request:
    branches:
      - stage
      - CLIENT-5734_pluggable-discovery
      - pluggable-discovery
    types:
      - opened
      - reopened
      - synchronize
  push:
    branches:
      - stage
      - CLIENT-5734_pluggable-discovery
      - pluggable-discovery
  workflow_dispatch:

jobs:
  l3:
    name: L3 discovery (k8s)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a357865c8979a06ad778ed3dd5e1a6f0d7fe0e # v4.3.0
        with:
          dotnet-version: "8.0.x"

      - name: Require the Enterprise feature key
        env:
          FEATURES: ${{ secrets.AES_FEATURES_CONF }}
        run: |
          set -euo pipefail
          if [[ -z "${FEATURES}" ]]; then
            echo "::error::AES_FEATURES_CONF is required to start the Enterprise cluster. L3 does not run on fork pull requests."
            exit 1
          fi

      - name: Setup kind and AKO
        id: kind-ako
        uses: aerospike/shared-workflows/.github/actions/setup-kind-ako@308f37e0cd5c7a6386a99ea7afc379d5a4ea9256 # v5.1.0
        with:
          features-content: ${{ secrets.AES_FEATURES_CONF }}

      - name: Run L3 discovery suite
        env:
          DISCOVERY_ENDPOINT_HOSTNAME: ${{ steps.kind-ako.outputs.endpoint-hostname }}
          DISCOVERY_INGRESS_PORTS: ${{ steps.kind-ako.outputs.ingress-ports }}
          DISCOVERY_SERVICE_NODE_PORTS: ${{ steps.kind-ako.outputs.service-node-ports }}
          DISCOVERY_KUBECONFIG: ${{ steps.kind-ako.outputs.kubeconfig }}
          AEROSPIKE_ADMIN_PASSWORD: ${{ steps.kind-ako.outputs.admin-password }}
        run: bash .github/discovery/run-l3-suite.sh

      - name: Publish Test Results
        if: ${{ always() && hashFiles('**/TestResults/**/*.trx') != '' }}
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
        with:
          files: "**/TestResults/**/*.trx"
          check_name: "L3 discovery (k8s)"

  l3-tls:
    name: L3 discovery (k8s, TLS)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a357865c8979a06ad778ed3dd5e1a6f0d7fe0e # v4.3.0
        with:
          dotnet-version: "8.0.x"

      - name: Require the Enterprise feature key
        env:
          FEATURES: ${{ secrets.AES_FEATURES_CONF }}
        run: |
          set -euo pipefail
          if [[ -z "${FEATURES}" ]]; then
            echo "::error::AES_FEATURES_CONF is required to start the Enterprise cluster. L3 does not run on fork pull requests."
            exit 1
          fi

      - name: Setup kind and AKO
        id: kind-ako
        uses: aerospike/shared-workflows/.github/actions/setup-kind-ako@308f37e0cd5c7a6386a99ea7afc379d5a4ea9256 # v5.1.0
        with:
          features-content: ${{ secrets.AES_FEATURES_CONF }}
          cluster-size: "2"

      - name: Serve TLS on the AerospikeCluster
        id: tls
        env:
          KUBECONFIG: ${{ steps.kind-ako.outputs.kubeconfig }}
        run: bash .github/discovery/enable-l3-tls.sh

      - name: Run L3 TLS suite
        env:
          DISCOVERY_ENDPOINT_HOSTNAME: ${{ steps.kind-ako.outputs.endpoint-hostname }}
          DISCOVERY_INGRESS_PORTS: ${{ steps.kind-ako.outputs.ingress-ports }}
          DISCOVERY_SERVICE_NODE_PORTS: ${{ steps.kind-ako.outputs.service-node-ports }}
          DISCOVERY_KUBECONFIG: ${{ steps.kind-ako.outputs.kubeconfig }}
          DISCOVERY_TLS_CA_FILE: ${{ steps.tls.outputs.ca-file }}
          DISCOVERY_TLS_NAME: ${{ steps.tls.outputs.tls-name }}
          L3_SUITE: FullyQualifiedName~TestK8sTlsName
          AEROSPIKE_ADMIN_PASSWORD: ${{ steps.kind-ako.outputs.admin-password }}
        run: bash .github/discovery/run-l3-suite.sh

      - name: Publish Test Results
        if: ${{ always() && hashFiles('**/TestResults/**/*.trx') != '' }}
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
        with:
          files: "**/TestResults/**/*.trx"
          check_name: "L3 discovery (k8s, TLS)"
