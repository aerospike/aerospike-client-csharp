name: Discovery L2 run

on:
  workflow_call:
    inputs:
      subset:
        description: ce runs a community cluster without TLS, ee an enterprise cluster with TLS
        type: string
        required: true
      server-container-repo:
        description: Aerospike image repository path
        type: string
        required: true
      server-tag:
        description: Aerospike image tag
        type: string
        required: true
      tls-listen-port-base:
        description: First TLS proxy listen port. Empty skips TLS proxies.
        type: string
        required: false
        default: ""
      profile:
        description: >-
          A discovery-l2-topology profile: default, reachable, pass-through-names,
          pass-through-ports, port-map-range, cn-only, low-mtu, port-range or
          idle-reset
        type: string
        required: false
        default: default

permissions:
  id-token: write
  contents: read
  checks: write
  pull-requests: write
  actions: write

jobs:
  l2:
    name: cluster
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.ref }}

      - name: Profile suite
        id: suite
        env:
          PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          case "${PROFILE}" in
            default) filter='FullyQualifiedName~TestL2Topology' ;;
            port-range) filter='FullyQualifiedName~TestL2SourcePortRange' ;;
            reachable) filter='FullyQualifiedName~TestL2ReachableNode' ;;
            pass-through-names | pass-through-ports) filter='FullyQualifiedName~TestL2PassThrough' ;;
            port-map-range) filter='FullyQualifiedName~TestL2PortMapRange' ;;
            cn-only) filter='FullyQualifiedName~TestL2CnOnlyCertificate' ;;
            low-mtu) filter='FullyQualifiedName~TestL2LowMtu' ;;
            idle-reset) filter='FullyQualifiedName~TestL2IdleReset' ;;
            *)
              echo "::error::Unknown profile ${PROFILE}"
              exit 1
              ;;
          esac
          echo "filter=${filter}" >> "${GITHUB_OUTPUT}"

      - name: Setup L2 topology
        id: l2
        # CLIENT-5791 — pin SHA (not branch/tag). Includes discovery-l2-topology + follow-up pin PR #16.
        uses: aerospike/aerospike-client-conformance/.github/actions/discovery-l2-topology@faa1474b97c83beb7c353bdca62733e6ad8ff1d4
        with:
          profile: ${{ inputs.profile }}
          subset: ${{ inputs.subset }}
          server-edition: ${{ inputs.subset == 'ee' && 'enterprise' || 'community' }}
          server-container-repo: ${{ inputs.server-container-repo }}
          server-tag: ${{ inputs.server-tag }}
          enable-tls: ${{ inputs.subset == 'ee' }}
          tls-listen-port-base: ${{ inputs.tls-listen-port-base }}
          features-content: ${{ inputs.subset == 'ee' && secrets.AES_FEATURES_CONF || '' }}
          oidc-provider: gh-aerospike
          oidc-audience: aerospike

      - name: Setup L2 .NET client runner
        id: runner
        uses: ./.github/actions/setup-l2-dotnet-runner

      - name: Run L2 discovery suite
        # cn-only (N-17) and idle-reset (F-1) soft-fail like Java until C# matches expected behavior.
        continue-on-error: ${{ inputs.profile == 'cn-only' || inputs.profile == 'idle-reset' }}
        env:
          CLIENT_IMAGE: ${{ steps.runner.outputs.client-image }}
          CLIENT_VOLUMES: ${{ steps.runner.outputs.client-volumes }}
          CLIENT_WORKDIR: ${{ steps.runner.outputs.client-workdir }}
          CLIENT_NETWORK: ${{ steps.l2.outputs.client-network }}
          ENV_FILE: ${{ steps.l2.outputs.env-file }}
          CLIENT_HOSTS: ${{ steps.l2.outputs.client-hosts }}
          TLS_CERT_DIR: ${{ steps.l2.outputs.tls-cert-dir }}
          DISCOVERY_SUBSET: ${{ inputs.subset }}
          L2_SUITE: ${{ steps.suite.outputs.filter }}
        run: |
          set -euo pipefail
          run_args=(
            --rm
            --network "${CLIENT_NETWORK}"
            --workdir "${CLIENT_WORKDIR}"
            --env-file "${ENV_FILE}"
            -e L2_SUITE
            -e DISCOVERY_SUBSET
          )
          remainder="${CLIENT_VOLUMES}"
          while [[ -n "${remainder}" ]]; do
            mount="${remainder%%;*}"
            if [[ "${remainder}" == *";"* ]]; then
              remainder="${remainder#*;}"
            else
              remainder=""
            fi
            [[ -z "${mount}" ]] && continue
            run_args+=(-v "${mount}")
          done
          if [[ "${DISCOVERY_SUBSET}" == "ee" ]]; then
            run_args+=(-v "${TLS_CERT_DIR}:/aerospike-tls:ro")
            run_args+=(-e "AEROSPIKE_CA_CERT=/aerospike-tls/ca.crt")
          fi
          IFS=',' read -r -a client_hosts <<< "${CLIENT_HOSTS}"
          for host in "${client_hosts[@]}"; do
            [[ -z "${host}" ]] && continue
            run_args+=(--add-host "${host}")
          done
          docker run "${run_args[@]}" "${CLIENT_IMAGE}" bash .github/discovery/run-l2-suite.sh

      - name: Show the node server log
        if: ${{ always() && steps.l2.outputs.node-server-log != '' }}
        env:
          LOG_FILE: ${{ steps.l2.outputs.node-server-log }}
        run: cat "${LOG_FILE}"

      - name: Fix bind-mount ownership
        if: ${{ always() }}
        run: |
          sudo chown -R "$(id -u):$(id -g)" "${GITHUB_WORKSPACE}"
          if [[ -d "${HOME}/.nuget" ]]; then
            sudo chown -R "$(id -u):$(id -g)" "${HOME}/.nuget"
          fi

      - name: Publish Test Results
        if: ${{ always() && hashFiles('**/TestResults/**/*.trx') != '' }}
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
        with:
          files: "**/TestResults/**/*.trx"
          check_name: "L2 discovery (${{ inputs.subset }}${{ inputs.profile != 'default' && format(', {0}', inputs.profile) || '' }})"
          fail_on: ${{ (inputs.profile == 'cn-only' || inputs.profile == 'idle-reset') && 'nothing' || 'test failures' }}
