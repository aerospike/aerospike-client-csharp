name: Publish to NuGet
run-name: "Publish to NuGet (version=${{ inputs.version }}, dry-run=${{ inputs.dry-run }})"

permissions:
  id-token: write
  contents: read

on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        required: true
        description: 'Release bundle version to publish (must already be promoted to PROD in JFrog)'
      dry-run:
        type: boolean
        required: false
        default: true
        description: 'Dry run: validate the package without publishing to NuGet.org'

jobs:
  publish:
    runs-on: ubuntu-latest
    # Approval gate before any push to NuGet.org. Configure the PROD environment
    # in repo Settings → Environments with required reviewers.
    environment: ${{ inputs.dry-run && 'PROD-dryrun' || 'PROD' }}
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@58077d3c7e43986b6b15fba718e8ea69e387dfcc # v2.15.1
      with:
        egress-policy: audit

    - name: Setup .NET
      uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
      with:
        dotnet-version: 8.0.x

    - name: Set up JFrog credentials
      uses: step-security/setup-jfrog-cli@893a92f96c7727242adf0e603c77b1f2a22390e1 # v4.9.1
      env:
        JF_URL: https://aerospike.jfrog.io
        JF_PROJECT: database
      with:
        oidc-provider-name: gh-aerospike
        oidc-audience: aerospike

    # Maturity gate: refuse to publish anything that has not been promoted to PROD.
    # Queries the JFrog Lifecycle promotion records and asserts that PROD is the
    # highest stage the bundle has reached. This prevents an operator from
    # accidentally shipping a DEV/TEST/STAGE/PREVIEW build to NuGet.org.
    - name: Verify release bundle is at PROD maturity
      env:
        BUNDLE_NAME: aerospike-client-csharp
        BUNDLE_VERSION: ${{ inputs.version }}
        JF_PROJECT: database
      run: |
        set -euo pipefail

        echo "Fetching promotion records for ${BUNDLE_NAME}/${BUNDLE_VERSION}..."
        records_json=$(jf rt curl -X GET \
          "/lifecycle/api/v2/promotion/records/${BUNDLE_NAME}/${BUNDLE_VERSION}?project=${JF_PROJECT}" \
          -H "Accept: application/json")

        echo "$records_json" | jq '.'

        envs=$(echo "$records_json" | jq -r '[(.promotions // [])[] | .environment] | unique | join(",")')
        echo "Bundle has been promoted to: ${envs:-<none>}"

        has_prod=$(echo "$records_json" | jq '
          any((.promotions // [])[]; .environment == "PROD")
        ')

        if [ "$has_prod" != "true" ]; then
          echo "::error::Release bundle ${BUNDLE_NAME}/${BUNDLE_VERSION} has not been promoted to PROD. Refusing to publish to NuGet.org."
          exit 1
        fi

        echo "Maturity check passed: bundle is at PROD."

    - name: Download signed packages from JFrog release bundle
      env:
        BUNDLE_NAME: aerospike-client-csharp
        BUNDLE_VERSION: ${{ inputs.version }}
      run: |
        for pattern in "*.nupkg" "*.snupkg"; do
          jf rt dl \
            --bundle "${BUNDLE_NAME}/${BUNDLE_VERSION}" \
            --flat \
            --fail-no-op \
            "$pattern" \
            packages/
        done

        find packages/ -type f ! -name "*.nupkg" ! -name "*.snupkg" -delete 2>/dev/null || true

    - name: List downloaded packages
      run: |
        echo "Downloaded packages:"
        ls -la packages/
        for pkg in packages/*.nupkg; do
          echo "=== $(basename "$pkg") ==="
          unzip -l "$pkg" | tail -5
        done

    - name: Push to NuGet.org
      if: ${{ !inputs.dry-run }}
      run: |
        dotnet nuget push "packages/*.nupkg" \
          --api-key "${{ secrets.NUGET_API_KEY }}" \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate

    - name: Summary
      run: |
        if [ "${{ inputs.dry-run }}" = "true" ]; then
          echo "::notice::DRY RUN — No packages were published to NuGet.org"
          echo "## Dry Run Summary" >> $GITHUB_STEP_SUMMARY
        else
          echo "## Publish Summary" >> $GITHUB_STEP_SUMMARY
        fi
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Version:** \`${{ inputs.version }}\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Packages" >> $GITHUB_STEP_SUMMARY
        for pkg in packages/*.nupkg; do
          echo "- \`$(basename "$pkg")\`" >> $GITHUB_STEP_SUMMARY
        done
        if [ "${{ inputs.dry-run }}" = "true" ]; then
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "To publish for real, re-run this workflow with **dry-run** unchecked." >> $GITHUB_STEP_SUMMARY
        fi
